[project]
name = "international-justice-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing the international-criminal-tribunals-skills suite: skill content, citation-verification guidance, jurisprudence search, and primary-source retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See repository LICENSE" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
international-justice-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server"]
